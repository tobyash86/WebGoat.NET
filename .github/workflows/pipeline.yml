name: Main Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # =================================================
  # Stage 0: Secret scanning (BEFORE build)
  # =================================================
  secrets:
    name: "0. Secret Scan"
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit
    permissions:
      contents: read

  # =================================================
  # Stage 1: Build
  # =================================================
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  # =================================================
  # Stage 9a: Infrastructure Hardening
  # Starts with build (after secrets) — runs in parallel
  # =================================================
  infrastructure-hardening:
    name: "9a. Infrastructure-Hardening"
    needs: [secrets]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/infrastructure-hardening.yml
    secrets:
      DEPLOYMENT_SERVER: ${{ secrets.DEPLOYMENT_SERVER }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}

  # =================================================
  # Stage 9a-i: Docker Install (Pure)
  # =================================================
  docker-install:
    name: "9a-i. Docker Install (Pure)"
    needs: [infrastructure-hardening]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-install.yml
    secrets:
      DEPLOYMENT_SERVER: ${{ secrets.DEPLOYMENT_SERVER }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}

  # =================================================
  # Stage 9a-ii: Docker CIS Harden
  # =================================================
  docker-cis-harden:
    name: "9a-ii. Docker CIS Harden"
    needs: [docker-install]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-cis-harden.yml
    secrets:
      DEPLOYMENT_SERVER: ${{ secrets.DEPLOYMENT_SERVER }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}

  # =================================================
  # Stage 1b: Dependency SCA
  # =================================================
  grype:
    name: "1b. Grype SCA"
    needs: build
    uses: ./.github/workflows/grype.yml
    secrets: inherit
    with:
      path: "."
      severity-cutoff: "high"
      fail-threshold: 5
      fail-build: "false"
    permissions:
      contents: read
      security-events: write
  # =================================================
  # Stage 1c: Dependency SCA (Trivy) — parallel with Grype
  # =================================================
  trivy-sca:
    name: "1c. Trivy SCA"
    needs: build
    uses: ./.github/workflows/trivy-sca.yml
    secrets: inherit
    with:
      path: "."
      severity: "CRITICAL,HIGH"
      fail-threshold: 5
    permissions:
      contents: read
      security-events: write
  # =================================================
  # Stage 2: Test
  # =================================================
  test:
    name: "2. Test"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: |
          dotnet test --configuration Release --no-restore --verbosity normal || echo "No tests found"

  # =================================================
  # Stage 3: CodeQL
  # =================================================
  codeql:
    name: "3. CodeQL Analysis"
    needs: build
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

  # =================================================
  # Stage 4: Docker Build & Push
  # =================================================
  docker:
    name: "4. Docker Build"
    needs: [build, test, codeql, grype, trivy-sca]
    uses: ./.github/workflows/dotnet.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # =================================================
  # Stage 5: Trivy Image Scan
  # =================================================
  trivy:
    name: "5. Trivy Image Scan"
    needs: docker
    uses: ./.github/workflows/trivy.yml
    secrets: inherit
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      severity: "CRITICAL,HIGH"
      fail-threshold: 5
    permissions:
      contents: read
      security-events: write

  # =================================================
  # Stage 5b: Syft SBOM
  # =================================================
  syft:
    name: "5b. Syft SBOM"
    needs: docker
    uses: ./.github/workflows/syft.yml
    secrets: inherit
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      image-name: ${{ needs.docker.outputs.image-name }}
      image-digest: ${{ needs.docker.outputs.image-digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # =================================================
  # Stage 6: Cosign Sign
  # =================================================
  cosign:
    name: "6. Cosign Sign"
    needs: docker
    uses: ./.github/workflows/cosign.yml
    secrets: inherit
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      image-digest: ${{ needs.docker.outputs.image-digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # =================================================
  # Stage 7: SLSA Attestation
  # =================================================
  slsa:
    name: "7. SLSA Attestation"
    needs: docker
    uses: ./.github/workflows/slsa.yml
    secrets: inherit
    with:
      image-name: ${{ needs.docker.outputs.image-name }}
      image-digest: ${{ needs.docker.outputs.image-digest }}
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

  # =================================================
  # Stage 8: Image Verification
  # =================================================
  verify:
    name: "8. Image Verification"
    runs-on: ubuntu-24.04
    needs: [docker, cosign, slsa]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Cosign signature
        run: |
          TARGET="${{ needs.docker.outputs.image-digest }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ needs.docker.outputs.image-ref }}"
          fi
          echo "Verifying Cosign signature for: $TARGET"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$TARGET"
          echo "✅ Cosign signature verified"

      - name: Verify SLSA / artifact attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REF="${{ needs.docker.outputs.image-ref }}"
          DIGEST_RAW="${{ needs.docker.outputs.image-digest }}"
          IMAGE_NAME="${{ needs.docker.outputs.image-name }}"

          if [ -n "$DIGEST_RAW" ]; then
            if echo "$DIGEST_RAW" | grep -q '@'; then
              OCI_REF="oci://${DIGEST_RAW}"
            else
              OCI_REF="oci://${IMAGE_NAME}@${DIGEST_RAW}"
            fi
          else
            OCI_REF="oci://${IMAGE_REF}"
          fi

          echo "Verifying SLSA attestation for: $OCI_REF"
          gh attestation verify "$OCI_REF" --repo "${{ github.repository }}"
          echo "✅ SLSA / artifact attestation verified"


  # =================================================
  # Stage 9: Deploy
  # Waits for image path + full infra path
  # =================================================
  deploy:
    name: "9. Deploy"
    runs-on: ubuntu-latest
    needs:
      - trivy
      - verify
      - syft
      - infrastructure-hardening
      - docker-install
      - docker-cis-harden
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: deployment
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Deploy finished
        run: |
          echo "Pipeline completed successfully"
          echo "• Secrets → Gitleaks"
          echo "• Build / Test / Scans (parallel with infra)"
          echo "• Infra → OS harden → Docker install → Docker CIS"
          echo "• Trivy / Syft / Cosign / SLSA / Verify"
          echo "• Deploy gated on image + infra stages"
name: build

on:
  workflow_call:
    outputs:
      image-ref:
        description: "Built image reference (with tag)"
        value: ${{ jobs.build.outputs.image-ref }}
      image-digest:
        description: "Image digest after push"
        value: ${{ jobs.build.outputs.image-digest }}
      image-name:
        description: "Image name without tag (for SLSA)"
        value: ${{ jobs.build.outputs.image-name }}

  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    outputs:
      image-ref: ${{ steps.meta.outputs.image }}
      image-digest: ${{ steps.push.outputs.digest }}
      image-name: ${{ steps.meta.outputs.image_name }}

    env:
      PUBLISH: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image name (lowercase)
        id: meta
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${IMAGE_NAME}:${{ github.sha }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "IMAGE=$IMAGE"

      - name: Build image
        run: docker build -t ${{ steps.meta.outputs.image }} .

      - name: Save Docker image (for Trivy)
        run: docker save ${{ steps.meta.outputs.image }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        if: env.PUBLISH == 'true'
        run: |
          docker push ${{ steps.meta.outputs.image }}
          docker tag ${{ steps.meta.outputs.image }} ${{ steps.meta.outputs.image_name }}:latest
          docker push ${{ steps.meta.outputs.image_name }}:latest

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.meta.outputs.image }})
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Pushed digest: $DIGEST"